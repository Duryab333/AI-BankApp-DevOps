name: Build and Push

on:
    workflow_call:


jobs:
    build-push:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v4
            - name: docker login
              uses: docker/login-action@v4
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}
            - name: Docker image build
              uses: docker/build-push-action@v7
              with:
                context: .
                push: true
                tags: |
                    ${{secrets.DOCKERHUB_USERNAME}}/github-actions-app:latest
                    ${{secrets.DOCKERHUB_USERNAME}}/github-actions-app:${{ github.ref_name}}
                    ${{secrets.DOCKERHUB_USERNAME}}/github-actions-app:${{ github.sha }}
