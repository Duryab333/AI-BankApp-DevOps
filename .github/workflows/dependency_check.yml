name: Depenency Scanner


on:
    workflow_call:


jobs:
    depenency_scanner:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v6
              
            - name: Set up JDK 21
              uses: actions/setup-java@v5
              with:
                distribution: 'temurin'
                java-version: '21'

            - name: Build project with Maven
              run: ./mvnw -B clean install -DskipTests
            
            - name: Get week number
              id: week
              run: echo "week=$(date -u +%Y-%U)" >> $GITHUB_OUTPUT

            - name: Cache Dependency-check DB
              uses: actions/cache@v6
              with:
                path:  ~/.m2/repository/org/owasp/dependency-check-data
                key: owasp-dc-${{ runner.os }}-${{ steps.week.outputs.week }} # dependency-check-${{ runner.os }}-${{ hashFiles('pom.xml') }}
                restore-keys: |
                  owasp-dc-${{ runner.os }}- # dependency-check-${{ runner.os }}-


            - name:  OWASP Dependency Check
              env:
                NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
              run: |
                mvn -B -ntp org.owasp:dependency-check-maven:check \
                -Dnvd.api.key=${NVD_API_KEY} \
                -Ddata.directory=$HOME/.m2/repository/org/owasp/dependency-check-data \
                -DfailBuildOnCVSS=7 \
                -Dformat=ALL \
                -DprettyPrint=true
                -DsuppressionFile=dependency-check-suppressions.xml

              
                #mvn dependency-check:check \
                #-Dnvd.api.key=${NVD_API_KEY} \
                #-Ddata.directory=$HOME/.m2/repository/org/owasp/dependency-check-data \
                #-DcveUrlMaxLength=1000

