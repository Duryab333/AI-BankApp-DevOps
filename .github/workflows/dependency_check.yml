name: Depenency Scanner


on:
    workflow_call:


jobs:
    depenency_scanner:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v6
              
            - name: Set up JDK 21
              uses: actions/setup-java@v5
              with:
                distribution: 'temurin'
                java-version: '21'

            - name: Build project with Maven
              run: ./mvnw -B clean install -DskipTests

            - name: Test Maven Central Search API
              run: |
                curl -v --max-time 30 \
                  "https://search.maven.org/solrsearch/select?q=g:%22org.springframework.boot%22&rows=1&wt=json"

            - name: Cache OWASP Dependency-Check
              uses: actions/cache@v6
              with:
                path: ~/.m2/repository/org/owasp/dependency-check-data
                key: dependency-check-${{ runner.os }}-${{ hashFiles('pom.xml') }}
                restore-keys: |
                  dependency-check-${{ runner.os }}-
            
            - name: OWASP Dependency-Check
              uses: dependency-check/Dependency-Check_Action@1.1.0
              id: depcheck
              env:
                JAVA_HOME: /opt/jdk
              with:
                project: 'AI-BankApp'
                path: '.'
                format: 'HTML'
                args: |
                  --failOnCVSS 7
                  -- disableCentral

              
            - name: Upload Dependency-Check Report
              uses: actions/upload-artifact@v4
              if: always()
              with:
                name: dependency-check-report
                path: reports/