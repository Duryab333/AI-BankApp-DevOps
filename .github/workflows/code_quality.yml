name: Code Quality Check

on:
  workflow_call:

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: Test@123
          MYSQL_DATABASE: bankappdb
        ports:
          - 3306:3306

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Wait for MySQL (deterministic readiness)
        run: |
          echo "Waiting for MySQL to accept connections..."
          for i in {1..40}; do
            if docker exec ${{ job.services.mysql.id }} \
              mysqladmin ping -uroot -pTest@123 --socket=/var/run/mysqld/mysqld.sock --silent; then
              echo "MySQL is ready."
              break
            fi
            echo "MySQL not ready yet... retrying ($i/40)"
            sleep 5
          done

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Cache Maven
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-


      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.16
          cache-dir:  ~/.m2/repository

      - name: Maven Validate (enforcer rules)
        run: mvn -B validate


      - name: Full Build + SpotBugs + Tests
        run: mvn -B clean verify

      - name:  SonarCloud Scan + Quality Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B sonar:sonar \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL}} \
            -Dsonar.organization=${{ secrets.SONAR_organization_KEY}} \
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY}} \
            -Dsonar.token=${SONAR_TOKEN} \
            -Dsonar.qualitygate.wait=true
