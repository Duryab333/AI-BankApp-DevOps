name: Code Quality Check

on:
  workflow_call:

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: Test@123
          MYSQL_DATABASE: bankappdb
        ports:
          - 3306:3306

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for MySQL (deterministic readiness)
        run: |
          echo "Waiting for MySQL to accept connections..."
          for i in {1..40}; do
            if docker exec ${{ job.services.mysql.id }} \
              mysqladmin ping -uroot -pTest@123 --socket=/var/run/mysqld/mysqld.sock --silent; then
              echo "MySQL is ready."
              break
            fi
            echo "MySQL not ready yet... retrying ($i/40)"
            sleep 5
          done

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.16

      - name: Maven Validate (enforcer rules)
        run: mvn -B validate

      - name: Compile & Package (no tests)
        run: mvn -B clean package -DskipTests

      - name: Full Build + SpotBugs + Tests
        run: mvn -B clean verify

     
          

      #- name: SonarQube Scan (GitHub Action)
      #  uses: sonarsource/sonarqube-scan-action@master
      #  env:
      #    SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      #    SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      #  with:
      #    args: |
      #      -Dsonar.projectKey=bankapp
      #      -Dsonar.organization=my-org
      - name: SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B sonar:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=${{ secrets.SONAR_organization_KEY}} \
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY}} \
            -Dsonar.token=${SONAR_TOKEN}


      - name: SonarQube Quality Gate
        id: quality-gate
        uses: sonarsource/sonarqube-quality-gate-action@master
        with:
          pollingTimeoutSec: 600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
